name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  ALLOWED_ORIGINS: http://localhost:5173
  # CI-only throwaway credentials for the ephemeral service database and seeded test accounts.
  SEED_ADMIN_PASSWORD: ci-admin-password
  SEED_PARTICIPANT_PASSWORD: ci-participant-password

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: airqa
          POSTGRES_PASSWORD: airqa_ci_only
          POSTGRES_DB: airqa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U airqa -d airqa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://airqa:airqa_ci_only@localhost:5432/airqa_test
      TEST_DATABASE_URL: postgresql+psycopg://airqa:airqa_ci_only@localhost:5432/airqa_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    name: Frontend (lint, typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright (API + UI)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: airqa
          POSTGRES_PASSWORD: airqa_ci_only
          POSTGRES_DB: airqa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U airqa -d airqa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://airqa:airqa_ci_only@localhost:5432/airqa
      BASE_URL: http://localhost:5173
      API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Backend environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt
      - name: Migrate and seed test accounts
        working-directory: backend
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/python -m app.cli seed --profile test
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
